<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Jogadores</h2>
    <form method="POST">
        Nome: <input type="text" name="nome">
        Time:
        <select name="time_id">
            {% for t in times %}
                <option value="{{ t.id }}">{{ t.nome }}</option>
            {% endfor %}
        </select>
        <button type="submit">Cadastrar</button>
    </form>

    <ul>
    {% for j in jogadores %}
        <li>{{ j.nome }} - Time: {{ j.time.nome }}</li>
    {% endfor %}
    </ul>

    <a href="/">Voltar</a>

</body>
</html>
